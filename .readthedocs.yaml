# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2
sphinx:
  configuration: docs/conf.py
build:
  # Stay on ubuntu-24.04: it is the newest image Read the Docs actually
  # supports for conda tools. On ubuntu-26.04 the conda-family tools install
  # but then immediately fail with
  #   EnvironmentLocationNotFound: Not a conda environment: .../conda/<ver>
  # (breaks miniconda3 *and* mambaforge alike), so it is unusable here.
  os: ubuntu-24.04
  tools:
    # Read the Docs decides mamba vs conda from the *prefix* of this value:
    #   mambaforge-*  -> mamba  (lower peak memory; what we want)
    #   miniforge3-*  -> conda front-end (higher memory; OOMs the openff stack)
    #   miniconda3-*  -> conda front-end (higher memory; OOMs the openff stack)
    # mambaforge is deprecated but still resolves, and is the only value that
    # gives us mamba.
    python: "mambaforge-latest"
python:
  install:
  - method: pip
    path: .
conda:
  environment: docs/environment.yml
