name: website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: mamba-org/setup-micromamba@v2
        name: Install dependencies
        with:
          environment-file: docs/environment.yml

      - name: Install current theme in dev mode
        run: |
          pip install -e .

      - name: Describe environment
        run: |
          pwd
          ls
          micromamba info
          micromamba list

      - name: Build Sphinx documentation
        run: |
          sphinx-build -j auto docs docs/_build/html

      - name: Checkout gh-pages
        if: success()
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: "deploy"
          clean: false

      - name: Prepare development deployment
        if: success() && github.event_name == 'push'
        env:
          PR: ${{ github.event.number }}
        run: |
          rm -rf deploy/dev
          mv docs/_build/html deploy/dev

      - name: Prepare PR deployment
        if: success() && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.number }}
        run: |
          rm -rf deploy/PR${PR}
          mv docs/_build/html deploy/PR${PR}

      - name: Prepare release deployment
        if: success() && github.event_name == 'release'
        env:
          PR: ${{ github.event.number }}
        run: |
          rm -rf deploy/${GITHUB_REF}
          mv docs/_build/html deploy/${GITHUB_REF}
          rm deploy/latest
          ln -s deploy/${GITHUB_REF} deploy/latest

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: deploy
          jekyll: false
          commit_message: "Deploy to GH Pages"
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Comment
        if: success() && github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v2
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: Example docs for this PR

      - name: Create or update comment
        if: success() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        env:
          PR: ${{ github.event.number }}
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Example docs for this PR [rendered here](https://openforcefield.github.io/openff-sphinx-theme/PR${{ github.event.number }}/index.html)
          edit-mode: replace
